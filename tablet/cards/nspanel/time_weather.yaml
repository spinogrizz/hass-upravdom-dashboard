- type: custom:button-card
  template:
    - base
    - nspanel-1row

  view_layout:
    grid-area: time_weather
  
  entity: sensor.weather_forecast_extra
  
  show_icon: false
  show_name: false
  show_label: false
  show_state: false

  card_mod:
    style: |
      @keyframes blink-colon {
        0%, 40% { opacity: 0.5; }
        50% { opacity: 0.05; }
        60%,100% { opacity: 0.5; }
      }
      .time-colon {
        animation: blink-colon 1.7s ease infinite;
      }

  styles:
    card:
      - padding: 0px
    grid:
      - display: grid
      - grid-template-areas: '"time weather"'
      - grid-template-columns: 1fr 1fr
      - width: 100%
      - height: 100%
    custom_fields:
      time:
        - grid-area: time
        - display: flex
        - align-items: center
        - justify-content: flex-start
        - padding-left: 32px
      weather:
        - grid-area: weather
        - display: flex
        - align-items: center
        - justify-content: flex-end
        - padding-right: 24px
        - margin-top: 10px

  custom_fields:
    time: >
      [[[
        // There is no triggers_update, so we need to fake the time elapsing
        const fake_time = states['sensor.every_5s']

        let now = new Date()
        let hours = String(now.getHours()).padStart(2, '0')
        let minutes = String(now.getMinutes()).padStart(2, '0')

        return `
          <span style="font-size: 70px; font-weight: 700; color: white;">
            ${hours}<span class="time-colon" style="position: relative; font-size: 58px; top: -7px; padding: 0 4px 0 6px">:</span>${minutes}
          </span>`
      ]]]

    weather: >
      [[[
        // Форматирование температуры с математическим минусом
        const formatTemp = (t) => t < 0 ? '−' + Math.abs(t) : t
        
        // Текущая погода
        let condition = entity.attributes['now_cond']
        let temp = parseInt(entity.attributes['now_temp'])
        
        // Прогноз примерно через 6 часов (forecast[6])
        let laterTemp = parseInt(entity.attributes['later_temp'])
        
        // Определение иконки
        let time = new Date(entity.attributes['now_date'])
        let hours = time.getHours()
        
        let icon = ''
        switch (condition) {
          case 'clear-night':      icon = "<span style='font-size: 38px'>🌙</span>"; break
          case 'cloudy':           icon = "<span style='font-size: 42px'>☁️</span>"; break
          case 'exceptional':      icon = "<span style='font-size: 42px'>⭕️</span>"; break
          case 'fog':              icon = "<span style='font-size: 42px'>🌫️</span>"; break
          case 'hail':             icon = "<span style='font-size: 42px'>🌨️</span>"; break
          case 'lightning':        icon = "<span style='font-size: 42px'>🌩️</span>"; break
          case 'lightning-rainy':  icon = "<span style='font-size: 42px'>⛈️</span>"; break
          case 'partlycloudy':     icon = (hours < 8 || hours > 20) ? "<span style='font-size: 42px'>☁️</span>" : "<span style='font-size: 42px'>⛅️</span>"; break
          case 'pouring':          icon = "<span style='font-size: 42px'>☔</span>"; break
          case 'rainy':            icon = "<span style='font-size: 42px'>🌧️</span>"; break
          case 'snowy':            icon = "<span style='font-size: 38px'>❄️</span>"; break
          case 'snowy-rainy':      icon = "<span style='font-size: 42px'>🌨️</span>"; break
          case 'sunny':            icon = "<span style='font-size: 42px'>☀️</span>"; break
          case 'windy':            icon = "<span style='font-size: 42px'>🌬️</span>"; break
          case 'windy-variant':    icon = "<span style='font-size: 42px'>🌬️</span>"; break
          default:                 icon = "<span style='font-size: 42px'>☁️</span>"; break
        }
        
        return `
          <div style="display: flex; flex-direction: column; align-items: flex-end; padding-right: 16px;">
            <div style="display: flex; align-items: center; gap: 10px;">
              <span style="filter: grayscale(40%)">${icon}</span>
              <span style="font-size: 45px; font-weight: 600; color: white;">${formatTemp(temp)}°</span>
            </div>
            <div style="font-size: 25px; color: rgba(255,255,255,0.5); margin-top: 2px; padding-right: 10px;">
              ${formatTemp(laterTemp)}°
            </div>
          </div>
        `
      ]]]
