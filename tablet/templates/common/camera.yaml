# A shared camera tile can follow motion or pin one camera on the second
# floor. The image URL is served by simple-camproxy, outside Home Assistant.
camera:
  template:
    - base
    - height-3rows

  variables:
    # A fixed ID pins the tile; otherwise the helper tracks the last camera
    # that saw motion. Fixed instances disable the cycling tap action.
    camera: null

  # Manual cycling writes to the same helper used by motion automation, so
  # the camera tile has one source of truth for automatic and manual changes.
  tap_action:
    action: call-service
    service: input_text.set_value
    service_data:
      entity_id: input_text.last_camera_detected_motion
      value: >
        [[[
          let cameras = [ 'door', 'veranda', 'terrace', 'backyard', 'garden', 'front' ]
          let current = states['input_text.last_camera_detected_motion'].state
          let idx = cameras.indexOf(current) + 1

          if ( idx >= cameras.length ) {
            idx = 0
          }

          return cameras[idx]
        ]]]

  # button-card displays the proxy snapshot through entity_picture.
  show_entity_picture: true

  # Reading the periodic sensor makes button-card reevaluate this template.
  # The timestamp then bypasses image caching, yielding a refreshed snapshot
  # even while the selected camera ID stays the same.
  entity_picture: >
      [[[
        // The periodic sensor is a redraw dependency, not a displayed value.
        const fake_time = states['sensor.every_5s']
        const fake_motion = states['input_text.last_camera_detected_motion']
        
        let camera_id = variables.camera
                     || states['input_text.last_camera_detected_motion'].state
                     || 'door'
        return "http://10.42.20.1:9091/homeassistant/camera/" + camera_id + "/medium"
               + "?ts=" + Date.now()
      ]]]
  
  styles:
    card:
      - padding: 0px
      - margin: 0px

    entity_picture:
      - width: auto
      - height: 110%
