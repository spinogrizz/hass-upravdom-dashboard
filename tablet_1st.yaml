# Home Assistant merges reusable button-card templates by name, then expands
# this floor's card files into one list. A card's view_layout.grid-area must
# match an area below; this keeps layout separate from card behavior.
# In button-card, [[[ ... ]]] is JavaScript evaluated in the browser with
# entity, states, and variables available; it is not a HA/Jinja template.
button_card_templates:
  !include_dir_merge_named tablet/templates

views:
  - title: Home
    type: custom:grid-layout
    background: center / cover no-repeat fixed url('/local/tablet/wallpaper_1st.jpg')
    layout:
      # Fixed cells fit the Fire tablet and make adjacent cards line up even
      # when their contents change. Repeated names make one card span cells.
      grid-template-columns: 90px 162px 162px repeat(2, 120px) repeat(4, 90px)
      grid-template-rows: repeat(7, 90px)
      grid-template-areas: |
        "light  main      main      cars     cars      cctv    cctv    cctv    cctv"
        "light  main      main      cars     cars      cctv    cctv    cctv    cctv"
        "light  main      main      cars     cars      cctv    cctv    cctv    cctv"
        "light  weather   weather   unifi    unifi     tv      tv      av      av"
        "light  weather   weather   unifi    unifi     tv      tv      av      av"
        "light  steam     dog       vacuum   vacuum    avcon   avcon   avcon   avcon"
        "light  steam     dog       vacuum   vacuum    volume  volume  volume  volume"

    cards:
      !include_dir_merge_list tablet/cards/1st
