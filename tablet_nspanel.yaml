# The NSPanel uses the same button-card templates as the tablets, but has a
# separate 480px layout for its smaller screen.
button_card_templates:
  !include_dir_merge_named tablet/templates

views:
  - title: Home
    cards:
      # Keep the normal grid and doorbell view as separate conditional cards.
      # A doorbell event can then replace the whole dashboard without having
      # to hide each ordinary widget individually.
      - type: custom:mod-card
        style: |
          ha-card {
            position: absolute;
            top: 0px;
            left: 0px;
            background: center / cover no-repeat fixed url('/local/tablet/wallpaper_nspanel.jpg');
          }
        card:
          type: conditional
          conditions:
            - entity: input_boolean.doorbell_on_dashboard
              state: 'off'
          card:
            type: custom:layout-card
            layout_type: custom:grid-layout
            layout:
              grid-template-columns: 236px 236px
              grid-template-rows: repeat(3, 158px)
              grid-template-areas: |
                "time_weather  time_weather"
                "tesla         haval"
                "lights        route"
            cards:
              !include_dir_merge_list tablet/cards/nspanel

      # The doorbell helper switches to a full-screen camera view; the same
      # helper makes the ordinary grid disappear above.
      - type: custom:mod-card
        style: |
          ha-card {
            position: absolute;
            top: 8px;
            left: 8px;
            background: transparent !important;
          }
        card:
          type: conditional
          conditions:
            - entity: input_boolean.doorbell_on_dashboard
              state: 'on'
          card: !include tablet/cards/nspanel/doorbell.yaml
