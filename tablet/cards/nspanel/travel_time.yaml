# Both directions fit in one NSPanel cell. An extra 20% turns route estimates
# into a more realistic door-to-door time, matching the tablet route template.
- type: custom:button-card
  template:
    - base
    - nspanel-1row

  view_layout:
    grid-area: route

  entity: sensor.travel_time_kindergarden
  # Re-render when the return trip changes too; the card's primary entity
  # only covers the outbound route.
  triggers_update:
    - sensor.every_1m
    - sensor.from_mvl_back_home_time

  update_timer: 15000

  show_icon: false
  show_name: false
  show_label: false
  show_state: false

  styles:
    card:
      - padding: 0px
    grid:
      - display: grid
      - grid-template-areas: '"content"'
      - grid-template-columns: 1fr
      - width: 100%
      - height: 100%
    custom_fields:
      content:
        - grid-area: content
        - display: flex
        - align-items: center
        - justify-content: center

  custom_fields:
    content: >
      [[[
        // The outbound trip drives the traffic-light urgency indicator.
        let thereTime = entity ? parseInt(entity.state*1.2) : 0
        
        let backTime = states['sensor.from_mvl_back_home_time'] 
          ? parseInt(states['sensor.from_mvl_back_home_time'].state*1.2)
          : 0
        
        let trafficIcon = ''
        if (thereTime <= 20) {
          trafficIcon = '/local/tablet/icons/traffic_green.png'
        } else if (thereTime <= 30) {
          trafficIcon = '/local/tablet/icons/traffic_yellow.png'
        } else {
          trafficIcon = '/local/tablet/icons/traffic_red.png'
        }
        
        return `
          <div style="display: flex; align-items: center; gap: 16px;">
            <img src="${trafficIcon}" style="width: 54px; height: auto;" />
            <div style="display: flex; flex-direction: column; align-items: flex-end;">
              <span style="font-size: 45px; font-weight: 600; color: white;">
                ${thereTime}<span style="font-size: 25px; opacity: 0.7; margin-left: 6px;">мин</span>
              </span>
              <div style="font-size: 22px; color: rgba(255,255,255,0.5); margin-top: 2px;">
                ↻ ${backTime} мин
              </div>
            </div>
          </div>
        `
      ]]]
