# Карточка Haval Jolion для NSPanel
- type: custom:button-card
  template:
    - base
    - nspanel-1row

  view_layout:
    grid-area: haval

  entity: switch.dzholion

  # Тап - завод/глушим машину
  tap_action:
    action: toggle
    entity_id: switch.dzholion

  show_icon: false
  show_name: false
  show_label: false
  show_state: false

  styles:
    card:
      - padding: 0px
      - overflow: hidden
    grid:
      - display: grid
      - grid-template-areas: '"image" "content"'
      - grid-template-columns: 1fr
      - grid-template-rows: 1fr
      - width: 100%
      - height: 100%
    custom_fields:
      image:
        - position: absolute
        - top: 0
        - left: 0
        - right: 0
        - bottom: 0
        - pointer-events: none
        - z-index: 1
      content:
        - position: absolute
        - top: 0
        - left: 0
        - right: 0
        - bottom: 0
        - display: flex
        - flex-direction: column
        - align-items: flex-start
        - justify-content: center
        - padding-left: 28px
        - z-index: 2

  custom_fields:
    image: >
      [[[
        return `<div style="
          width: 100%;
          height: 100%;
          background-image: url('/local/tablet/haval_small.png');
          background-size: cover;
          background-position: center;
        "></div>`
      ]]]

    content: >
      [[[
        const rangeRaw = states['sensor.dzholion_zapas_khoda_na_benzine']?.state
        const parsedRange = Number.parseFloat(String(rangeRaw))
        const range = Number.isFinite(parsedRange) ? Math.trunc(parsedRange) : '—'

        let rangeColor = '#FFFFFF'
        if (typeof range === 'number' && range < 100) {
          rangeColor = '#CF4141'
        } else if (typeof range === 'number' && range < 150) {
          rangeColor = '#D5C539'
        }

        return `
          <div style="display: flex; flex-direction: column; align-items: flex-start; gap: 0px;">
            <span style="font-size: 50px; font-weight: 600; color: ${rangeColor};">
              ${range}
            </span>
            <span style="font-size: 28px; color: ${rangeColor}; line-height: 1;">км</span>
          </div>
        `
      ]]]
