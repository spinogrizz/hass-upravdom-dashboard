# This compact tile combines a charge sensor with climate and defrost actions.
# custom_fields overlays the car art and data within one NSPanel grid cell.
- type: custom:button-card
  template:
    - base
    - nspanel-1row

  view_layout:
    grid-area: tesla

  entity: sensor.spacex_battery_level

  # Tap acts as a single cabin-preheat toggle across the climate and defrost
  # entities. If either is already heating, stop both to avoid a half-on car.
  tap_action: >
    [[[
      let defrostOn = states['switch.spacex_defrost']?.state === 'on'
      let climateState = states['climate.spacex_climate']?.state
      let isHeating = climateState === 'heat_cool' || climateState === 'heating' || climateState === 'heat'
      
      if (defrostOn || isHeating) {
        return {
          action: 'call-service',
          service: 'homeassistant.turn_off',
          service_data: {
            entity_id: ['climate.spacex_climate', 'switch.spacex_defrost']
          }
        }
      }
      return {
        action: 'call-service',
        service: 'climate.set_hvac_mode',
        service_data: {
          entity_id: 'climate.spacex_climate',
          hvac_mode: 'heat_cool'
        }
      }
    ]]]

  # Hold gives quick access to defrost without changing the tap behavior.
  hold_action:
    action: call-service
    service: switch.turn_on
    service_data:
      entity_id: switch.spacex_defrost

  show_icon: false
  show_name: false
  show_label: false
  show_state: false

  styles:
    card:
      - padding: 0px
      - overflow: hidden
      - background: >
          [[[
            // Match the active highlight to the same two heating entities
            // used by the tap action, so the visual cue agrees with control.
            let defrostOn = states['switch.spacex_defrost']?.state === 'on'
            let climateState = states['climate.spacex_climate']?.state
            let isHeating = climateState === 'heat_cool' || climateState === 'heating' || climateState === 'heat'
            
            let baseBg = '#00000099'
            
            if (defrostOn || isHeating) {
              return `radial-gradient(ellipse at center, #22000099 40%, #55111199 75%, #88222299 100%)`
            }
            return baseBg
          ]]]
    grid:
      - display: grid
      - grid-template-areas: '"image" "content"'
      - grid-template-columns: 1fr
      - grid-template-rows: 1fr
      - width: 100%
      - height: 100%
    custom_fields:
      image:
        - position: absolute
        - top: 0
        - left: 0
        - right: 0
        - bottom: 0
        - pointer-events: none
        - z-index: 1
      content:
        - position: absolute
        - top: 0
        - left: 0
        - right: 0
        - bottom: 0
        - display: flex
        - flex-direction: column
        - align-items: flex-start
        - justify-content: center
        - padding-left: 28px
        - z-index: 2

  custom_fields:
    image: >
      [[[
        return `<div style="
          width: 100%;
          height: 100%;
          background-image: url('/local/tablet/tesla_small.png');
          background-size: cover;
          background-position: center;
        "></div>`
      ]]]

    content: >
      [[[
        // Guard against unavailable/empty HA states before numeric coercion.
        const rawCharge = entity?.state
        const charge = Number(rawCharge)
        const hasCharge = rawCharge !== undefined && rawCharge !== null && String(rawCharge).trim() !== '' &&
          Number.isFinite(charge) && charge >= 0 && charge <= 100
        
        let chargingState = states['sensor.spacex_charging']
        let isCharging = chargingState && chargingState.state === 'charging'
        
        // Only a valid percentage can trigger a low-charge color.
        let chargeColor = '#FFFFFF'
        if (hasCharge && charge < 30) {
          chargeColor = '#CF4141'
        } else if (hasCharge && charge < 65) {
          chargeColor = '#D5C539'
        }
        
        let chargingIcon = isCharging 
          ? '<div style="margin-top: 6px;"><ha-icon icon="mdi:lightning-bolt" style="width: 32px; height: 32px; color: #67C743;"></ha-icon></div>'
          : ''
        
        return `
          <div style="display: flex; flex-direction: column; align-items: flex-start;">
            <span style="font-size: 52px; font-weight: 700; color: ${chargeColor};">
              ${hasCharge ? charge : '—'}<span style="font-size: 28px; opacity: 0.8;">%</span>
            </span>
            ${chargingIcon}
          </div>
        `
      ]]]
