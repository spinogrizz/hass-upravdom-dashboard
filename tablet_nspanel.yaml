button_card_templates:
  !include_dir_merge_named tablet/templates

views:
  - title: Home
    cards:
      # Обычное состояние - все виджеты
      - type: custom:mod-card
        style: |
          ha-card {
            position: absolute;
            top: 0px;
            left: 0px;
            background: center / cover no-repeat fixed url('/local/tablet/wallpaper_nspanel.jpg');
          }
        card:
          type: conditional
          conditions:
            - entity: input_boolean.doorbell_on_dashboard
              state: 'off'
          card:
            type: custom:layout-card
            layout_type: custom:grid-layout
            layout:
              grid-template-columns: 236px 236px
              grid-template-rows: repeat(3, 158px)
              grid-template-areas: |
                "time_weather  time_weather"
                "tesla         haval"
                "lights        route"
            cards:
              !include_dir_merge_list tablet/cards/nspanel

      # Состояние звонка в дверь - камера на весь экран
      - type: custom:mod-card
        style: |
          ha-card {
            position: absolute;
            top: 8px;
            left: 8px;
            background: transparent !important;
          }
        card:
          type: conditional
          conditions:
            - entity: input_boolean.doorbell_on_dashboard
              state: 'on'
          card: !include tablet/cards/nspanel/doorbell.yaml
