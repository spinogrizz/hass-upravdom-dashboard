# Reuse the same templates as the first floor, while this view selects its
# own card list and grid placement. Card files can stay small and focused.
button_card_templates:
  !include_dir_merge_named tablet/templates

views:
  - title: Home
    type: custom:grid-layout
    background: center / cover no-repeat fixed url('/local/tablet/wallpaper_2nd.jpg')
    layout:
      # Repeated area names reserve multi-cell space for the large camera,
      # weather, and floor-status cards on the fixed-size tablet screen.
      grid-template-columns: 90px 162px 162px repeat(2, 120px) repeat(4, 90px)
      grid-template-rows: repeat(7, 90px)
      grid-template-areas: |
        "light  main      main      cars     cars      cctv    cctv    cctv    cctv"
        "light  main      main      cars     cars      cctv    cctv    cctv    cctv"
        "light  main      main      cars     cars      cctv    cctv    cctv    cctv"
        "light  weather   weather   none1    none1     veranda veranda veranda veranda"
        "light  weather   weather   none1    none1     veranda veranda veranda veranda"
        "light  none2     dog       none3    none3     veranda veranda veranda veranda"
        "light  none2     dog       none3    none3     none4   none4   none4   none4"

    card_mod:
      style: |
        :host {
          --masonry-view-card-margin: 0;
        }

    cards:
      !include_dir_merge_list tablet/cards/2nd 
