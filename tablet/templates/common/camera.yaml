camera:
  template:
    - base
    - height-3rows

  variables:
    # fixed camera id (e.g. 'veranda'); if not set, show the last camera
    # that detected motion (override tap_action with 'none' for fixed ones)
    camera: null

  # tap to switch between cameras
  tap_action:
    action: call-service
    service: input_text.set_value
    service_data:
      entity_id: input_text.last_camera_detected_motion
      value: >
        [[[
          let cameras = [ 'door', 'veranda', 'terrace', 'backyard', 'garden', 'front' ]
          let current = states['input_text.last_camera_detected_motion'].state
          let idx = cameras.indexOf(current) + 1

          if ( idx >= cameras.length ) {
            idx = 0
          }

          return cameras[idx]
        ]]]

  # use entity picture as a camera feed view
  show_entity_picture: true

  # automation is used to store last camera name that triggered motion 
  # to the input_text variable, that we use as camera-id for proxy
  entity_picture: >
      [[[
        // There is no triggers_update, so we need to fake the time elapsing
        const fake_time = states['sensor.every_5s']
        const fake_motion = states['input_text.last_camera_detected_motion']
        
        let camera_id = variables.camera
                     || states['input_text.last_camera_detected_motion'].state
                     || 'door'
        return "http://10.42.20.1:9091/homeassistant/camera/" + camera_id + "/medium"
               + "?ts=" + Date.now()
      ]]]
  
  styles:
    card:
      - padding: 0px
      - margin: 0px

    entity_picture:
      - width: auto
      - height: 110%
