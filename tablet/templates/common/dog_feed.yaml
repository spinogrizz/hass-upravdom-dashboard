# Feeding and walking are inferred from timestamps and a dog-outside helper.
# A single tile prioritizes the most urgent condition, then a tap acknowledges
# that displayed condition when an automation missed a real-world event.
dog_feed:
  entity: input_datetime.dog_fed_last_time

  template:
    - base
    - height-2rows

  show_entity_picture: true
  show_state: false
  show_label: true
  show_name: false

  # Reset the displayed condition, not every dog helper. In particular, an
  # outside correction also records an inside time so the stale walk warning
  # does not immediately replace the corrected state.
  tap_action: |
    [[[
      const now = Date.now() / 1000;
      const setTime = (entity_id) => ({
        action: 'call-service',
        service: 'input_datetime.set_datetime',
        service_data: {entity_id, timestamp: now},
      });

      if (states['input_boolean.dog_outside']?.state === 'on') {
        return {
          action: 'multi-actions',
          actions: [
            {
              action: 'call-service',
              service: 'input_boolean.turn_off',
              service_data: {entity_id: 'input_boolean.dog_outside'},
            },
            setTime('input_datetime.dog_come_inside_time'),
          ],
        };
      }
      if (variables.fed_time > variables.hungry_interval) {
        return setTime('input_datetime.dog_fed_last_time');
      }
      if (now - variables.last_walk_event > variables.walk_interval) {
        return setTime('input_datetime.dog_come_inside_time');
      }
      return setTime('input_datetime.dog_fed_last_time');
    ]]]

  variables:
    # Shared thresholds keep the picture, text, background, and tap behavior
    # in agreement about when feeding or a walk is overdue.
    hungry_interval: 18000

    walk_interval: 18000

    fed_time: |
      [[[
        let fed = new Date(entity.state).getTime()/1000
        let now = new Date().getTime()/1000
        return now - fed
      ]]]

    # The later event wins so an old departure cannot override a newer return.
    last_walk_event: |
      [[[
        let outsideTime = new Date(states['input_datetime.dog_come_outside_time'].state).getTime()/1000
        let insideTime = new Date(states['input_datetime.dog_come_inside_time'].state).getTime()/1000
        return Math.max(outsideTime, insideTime)
      ]]]

    outside_time: |
      [[[
        let outsideTime = new Date(states['input_datetime.dog_come_outside_time'].state).getTime()/1000
        let now = new Date().getTime()/1000
        return Math.floor((now - outsideTime) / 60)
      ]]]

  # Apply the same priority as the correction action: outside, hungry,
  # overdue walk, then recently fed. Otherwise a tap would reset the wrong
  # underlying condition.
  entity_picture: |
    [[[
      let state = "happy";
      if (states['input_boolean.dog_outside'].state === 'on') {
        state = "walk";
      }
      else if (variables.fed_time > variables.hungry_interval) {
        state = "cry";
      }
      else if ((new Date().getTime()/1000 - variables.last_walk_event) > variables.walk_interval) {
        state = "sad";
      }
      else if (variables.fed_time < 1800) {
        state = "thumb";
      }

      return "/local/tablet/icons/dog_" + state + ".png"
    ]]]

  # Time-only changes do not update the entity, so depend on the minute
  # sensor to keep elapsed durations current on screen.
  label: |
    [[[
      // This dependency triggers a redraw without being displayed.
      const fake_time = states['sensor.every_1m']

      let h = Math.ceil((variables.fed_time / 3600) * 10) / 10
      let now = new Date().getTime()/1000
      let doorDate = new Date(variables.last_walk_event * 1000)
      let doorTime = doorDate.getHours().toString().padStart(2, '0') + ':' +
                    doorDate.getMinutes().toString().padStart(2, '0')

      if (states['input_boolean.dog_outside'].state === 'on') {
        let minutes = variables.outside_time
        if (minutes === 0) {
          return "<span style='font-size: 18pt'>Вышла</span>"
        } else {
          return minutes + " <span style='font-size: 16pt'>мин</span>"
        }
      }
      else if (variables.fed_time > variables.hungry_interval) {
        return Math.ceil(h) + " <span style='font-size: 16pt'>часов</span>"
      }
      else if ((now - variables.last_walk_event) > variables.walk_interval) {
        return "🚪 " + doorTime + "&nbsp"
      }
      else if (h <= 0.5) {
        return "Ура!"
      } else if (h <= 1) {
        return Math.ceil(h) + " <span style='font-size: 16pt'>час</span>"
      } else if (h <= 4) {
        return Math.ceil(h) + " <span style='font-size: 16pt'>часа</span>"
      } else {
        return Math.ceil(h) + " <span style='font-size: 16pt'>часов</span>"
      }
    ]]]

  # Match the background to the same priority used by the icon and label.
  styles:
    card:
      - background: |
          [[[
            let now = new Date().getTime()/1000
            if (states['input_boolean.dog_outside'].state === 'on') {
              return "radial-gradient(#00336699, #00112299)"
            }
            else if (variables.fed_time > variables.hungry_interval) {
              return "radial-gradient(#77000099, #33000099)"
            }
            else if ((now - variables.last_walk_event) > variables.walk_interval) {
              return "radial-gradient(#00006699, #00003399)"
            }
            else if (variables.fed_time < 1800) {
              return "radial-gradient(#00440099, #00220099)"
            }
            else {
              return "#00000099"
            }
          ]]]
    icon:
      - width: |
          [[[
            return states['input_boolean.dog_outside'].state === 'on' ? "58%" : "52%"
          ]]]
      - position: relative
      - left: 0%
      - top: -2%

    label:
      - font-size: 23pt
      - position: relative
      - top: -22%
