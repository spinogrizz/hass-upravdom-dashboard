# Samsung Frame exposes art mode separately from its media source. Map both
# into one UI mode so the label and background describe what the room sees.
- type: custom:button-card
  entity: media_player.samsung_frame
  template: 
    - media_device

  tap_action:
    action: call-service
    service: script.toggle_samsung_frame

  # The selected preset is stored in a helper, so changes there must redraw
  # this tile even if the TV entity itself has not reported a new state.
  triggers_update:
    - media_player.samsung_frame
    - input_text.media_latest_scene

  variables: 
    mode: >
      [[[
        let source = entity.attributes.source 
        let art_mode = (entity.attributes.art_mode_status == 'on')

        if ( art_mode ) {
          return "art"
        } else if ( source == 'TV/HDMI' ) {
          return "receiver"
        } else if ( source == 'YouTube' ) {
          return "youtube"
        } else {
          return "off"
        }
      ]]]

  view_layout:
    grid-area: tv

  label: >
    [[[
      switch ( variables.mode ) {
        case 'receiver':     return 'Receiver'
        case 'youtube':      return 'YouTube'
        default:             return ''
      }
    ]]]

  styles:
    card:
      - background-image: >
          [[[
            return "url('/local/tablet/bg_tv_" + variables.mode + ".png')"
          ]]]


# The receiver has its own power/source state, which need not match the TV.
- type: custom:button-card
  entity: media_player.marantz_nr1508
  template: 
    - media_device

  view_layout:
    grid-area: av

  # Display different background depending on a on/off state
  state:
    - value: 'on'
      styles:
        card:
          - background-image: url("/local/tablet/bg_receiver_on.png")        

    - value: 'off'
      styles:
        card:
          - background-image: url("/local/tablet/bg_receiver_off.png")        

  label: >
    [[[
      return entity.attributes.source
    ]]]

# These buttons call one script that coordinates the TV and receiver; a
# source change cannot be represented by toggling either device alone.
- type: horizontal-stack
  view_layout:
    grid-area: avcon

  cards:
    - type: horizontal-stack
      cards:
        - type: custom:button-card
          template: media_input
          icon: mdi:youtube
          variables:
            input: YouTube

        - type: custom:button-card
          template: media_input
          icon: mdi:gamepad-variant
          variables:
            input: Games

        - type: custom:button-card
          template: media_input
          icon: mdi:apple
          variables:
            input: Apple TV                     

        - type: custom:button-card
          template: media_input
          icon: mdi:album
          variables:
            input: Vinyl

# Embed the receiver volume control inside a button-card so it can occupy
# the same dashboard grid and share the same visual style.
- type: custom:button-card
  template:
    - base
    - height-1row

  icon: mdi:volume-high
  show_icon: true

  view_layout:
    grid-area: volume

  custom_fields:
    slider:
      card:
        type: custom:slider-button-card
        entity: media_player.marantz_nr1508
        show_name: false
        show_state: false
        compact: true

        slider: 
          direction: left-right
          background: solid 

        action_button:
          show: false

        tap_action:
          action: none

        icon: 
          show: false

        # Style the nested slider without changing the enclosing button card.
        card_mod:
          style: |
            :host {
                --ha-card-background: linear-gradient(to right, #1D081E, #0A171F) !important;
            }

            .slider-bg {
              --slider-bg-color: #3F3D67 !important;
            }
            
            .slider-thumb::before {
              background-color: purple !important;
            }

  styles:
    icon: 
      - color: white
      - opacity: >
          [[[
            return states['media_player.marantz_nr1508'].state == 'on' ? '1.0' : '0.8'
          ]]]
      - position: absolute
      - top: 3%x
      - left: 6%
      - z-index: 15
      - width: 10%
      - pointer-events: none
      - user-select: none

    # slider-button-card has no custom min/max clamp. Oversizing it clips the
    # usable part to roughly 20–60%, the receiver's practical volume range.
    custom_fields:
      slider:
        - position: absolute
        - top: -0px
        - left: -100%
        - width: 350%
        - height: 100%
        - border: none
