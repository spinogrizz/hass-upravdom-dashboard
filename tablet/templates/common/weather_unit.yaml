# The forecast sensor flattens each time slot into *_date, *_cond, and *_temp
# attributes. One template can therefore render every slot consistently.
weather_unit:
  entity: sensor.weather_forecast_extra

  # Emoji glyphs have different visual baselines; the spans compensate so
  # changing weather does not make the small forecast row jump around.
  custom_fields: 
    weather_icon: >
      [[[
        let time = new Date(entity.attributes[variables.forecast+'_date'])
        let hours = time.getHours()
        let condition = entity.attributes[variables.forecast+'_cond']

        // At night, partly cloudy should not imply visible sunshine.
        switch (condition) {

          case 'clear-night':      return "<span style='font-size: 23pt'>🌙</span>"
          case 'cloudy':           return "<span style='position: relative; top: -5px'>☁️</span>"
          case 'exceptional':      return "⭕️"
          case 'fog':              return "🌫️"
          case 'hail':             return "🌨️"
          case 'lightning':        return "🌩️"
          case 'lightning-rainy':  return "⛈️"
          case 'partlycloudy':     return (hours < 8 || hours > 20) ? "☁️" : "<span style='position: relative; top: -9px'>⛅️</span>"
          case 'pouring':          return "☔"
          case 'rainy':            return "🌧️"
          case 'snowy':            return "<span style='font-size: 23pt'>❄️</span>"
          case 'snowy-rainy':      return "🌨️"
          case 'sunny':            return "☀️"
          case 'windy':            return "🌬️"
          case 'windy-variant':    return "🌬️"
          default:                 return "☁️"
        }
      ]]]

  show_icon: false
  show_entity_picture: false
  show_label: true
  show_name: false

  label: >
    [[[
      return parseInt(entity.attributes[variables.forecast+'_temp']) + '°'
    ]]]

  styles:
    card:
      # Subtle daylight tint separates forecast times without extra labels.
      - background: >
          [[[
            let time = new Date(entity.attributes[variables.forecast+'_date'])
            let hours = time.getHours()

            console.log(hours)

            if ( hours > 21 || hours < 7 ) {
              return '#00001155'
            } else if ( hours > 11 && hours < 17 ) {
              return '#E5C04B09'
            } else {
              return 'none'
            }
          ]]]

      - border: none
      - border-radius: 0px
      - width: 105px
      - height: 172px

    label:
      - font-size: 22pt
      - position: absolute
      - bottom: 28px
      - left: 4px
      - width: 100%
      - color: white 

    custom_fields:
      weather_icon:
        - font-size: 40px
        - position: absolute
        - top: 35px
        - left: 1px
        - width: 100%
        - filter: grayscale(40%)
