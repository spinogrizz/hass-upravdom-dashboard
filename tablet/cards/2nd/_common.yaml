# Both tablet floors reuse the same templates. This file changes only the
# cards and camera choices needed for the second-floor layout.
# The first camera follows motion; the veranda view below pins an ID and
# disables cycling so the two camera areas serve different purposes.
- type: custom:button-card
  template: camera
  
  view_layout:
    grid-area: cctv

# Pinning the veranda avoids losing this view when another camera detects motion.
- type: custom:button-card
  template: camera

  variables:
    camera: veranda

  tap_action:
    action: none

  view_layout:
    grid-area: veranda

# Reuse the floor overview so temperature and presence keep the same meaning.
- type: custom:button-card
  template: main
  
  view_layout:
    grid-area: main

# Reuse the composed forecast card to preserve the same visual rhythm.
- type: custom:button-card
  template: weather
  
  view_layout:
    grid-area: weather

# The two vehicle tiles share one grid area through their parent template.
- type: custom:button-card
  template: cars

  view_layout:
    grid-area: cars

# Dog status is shared across floors because the underlying helpers are global.
- type: custom:button-card
  template: dog_feed

  view_layout:
    grid-area: dog

