main:
  template: 
    - base
    - height-3rows

  show_state: true
  show_icon: false
  show_label: true

  variables: 
    # глобальная функция для генерации span-элементов с температурой
    _unit_function: >
      [[[
        return function (is_ac_on, is_heat_on, is_floor_on, temp) {
          var style = is_ac_on ? 'cold' : is_heat_on ? 'hot' : is_floor_on ? 'floor' : 'none'
          return "<span class='" + style + "'>" + (Math.round(temp) || '--') + "°</span>"
        }
      ]]]
    _is_floor_visible: >
      [[[
        return function (floor) {
          return floor === '1' || floor === '2' || floor === '3'
        }
      ]]]
    _is_occupy_visible: >
      [[[
        return function (floor) {
          return variables._is_floor_visible(floor) || floor === 'out'
        }
      ]]]
    _floor_top: >
      [[[
        return function (floor) {
          if (!variables._is_floor_visible(floor)) return '-100px'
          return `${Math.round(204 - (Number(floor) - 1) * 71.5)}px`
        }
      ]]]
    _occupy_top: >
      [[[
        return function (floor) {
          if (variables._is_floor_visible(floor)) return variables._floor_top(floor)
          if (floor === 'out') return variables._floor_top('1')
          return '-100px'
        }
      ]]]
    _occupy_left: >
      [[[
        return function (floor, otherFloor, is_second_person) {
          if (floor === 'out') {
            if (otherFloor === 'out') return is_second_person ? '132px' : '118px'
            return '126px'
          }

          if (variables._is_floor_visible(floor)) {
            if (is_second_person && otherFloor === floor) return '22px'
            return '34px'
          }

          return '34px'
        }
      ]]]

  # use custom fields to display presence dots
  custom_fields:
    occupy_denis: >
      [[[
        const denisFloor = states['sensor.unifi_device_presence_denis_smartphone_floor']?.state
        if (!variables._is_occupy_visible(denisFloor)) return ''
        return denisFloor === 'out' ? "<span style='font-size:0.8em; position: relative; top: -2px; left: -2px'>◦</span>" : '•'
      ]]]
    occupy_valya: >
      [[[
        const valyaFloor = states['sensor.unifi_device_presence_valya_smartphone_floor']?.state
        if (!variables._is_occupy_visible(valyaFloor)) return ''
        return valyaFloor === 'out' ? "<span style='font-size:0.8em; position: relative; top: -2px; left: -2px'>◦</span>" : '•'
      ]]]

    temp_1st: >
      [[[ 
        let is_ac_on = false
        let is_heat_on = states['switch.heating_1st_entrance_hall'].state == 'on'
                      || states['switch.heating_1st_living_room'].state == 'on'
        let is_floor_on = (states['switch.pump_floor_heating_1st'].state == 'on')
        let temp = states['sensor.sonoff_living_room_temperature_temperatura'].state 

        return variables._unit_function(is_ac_on, is_heat_on, is_floor_on, temp)
      ]]]

    temp_2nd: >
      [[[ 
        let is_ac_on = false
        let is_heat_on = states['climate.thermostat_2nd_cabinet'].state == 'heat'
                      || states['climate.thermostat_2nd_guest_room'].state == 'heat'
                      || states['climate.thermostat_2nd_room1'].state == 'heat'
        let is_floor_on = (states['switch.pump_floor_heating_2nd'].state == 'on')
        let temp = states['sensor.temperature_2nd_average'].state

        return variables._unit_function(is_ac_on, is_heat_on, is_floor_on, temp)
      ]]]

    temp_3rd: >
      [[[ 
        let is_ac_on = states['input_boolean.bedroom_air_conditioning'].state == 'on'
        let is_heat_on = false
        let is_floor_on = (states['switch.pump_floor_heating_3rd'].state == 'on')
        let temp = states['sensor.temperature_bedroom'].state

        return variables._unit_function(is_ac_on, is_heat_on, is_floor_on, temp)
      ]]]

    water_2nd: >
      [[[
        return states['sensor.water_use_floor']?.state?.split(',').includes('2nd')
          ? '<ha-icon icon="mdi:water" style="width: 22px; height: 22px;" />'
          : ''
      ]]]
    water_3rd: >
      [[[
        return states['sensor.water_use_floor']?.state?.split(',').includes('3rd')
          ? '<ha-icon icon="mdi:water" style="width: 22px; height: 22px;" />'
          : ''
      ]]]
  
  styles:
    card: 
      - background-image: url('/local/tablet/main_card_bg.png')
      - background-size: cover
      - background-color: '#00000099'

    custom_fields:
      occupy_denis:
        - position: absolute
        - top: >
            [[[
              const floor = states['sensor.unifi_device_presence_denis_smartphone_floor']?.state
              return variables._occupy_top(floor)
            ]]]
        - left: >
            [[[
              const denisFloor = states['sensor.unifi_device_presence_denis_smartphone_floor']?.state
              const valyaFloor = states['sensor.unifi_device_presence_valya_smartphone_floor']?.state
              return variables._occupy_left(denisFloor, valyaFloor, false)
            ]]]
        - font-size: 40px
        - line-height: 1
        - color: "#8FC6E8"

      occupy_valya:
        - position: absolute
        - top: >
            [[[
              const floor = states['sensor.unifi_device_presence_valya_smartphone_floor']?.state
              return variables._occupy_top(floor)
            ]]]
        - left: >
            [[[
              const denisFloor = states['sensor.unifi_device_presence_denis_smartphone_floor']?.state
              const valyaFloor = states['sensor.unifi_device_presence_valya_smartphone_floor']?.state
              return variables._occupy_left(valyaFloor, denisFloor, true)
            ]]]
        - font-size: 40px
        - line-height: 1
        - color: "#DFA0C3"

      temp_1st:
        - position: absolute
        - top: 204px
        - width: 66px
        - left: 52px

      temp_2nd:
        - position: absolute
        - top: 132px
        - width: 66px
        - left: 52px

      temp_3rd:
        - position: absolute
        - top: 61px
        - width: 66px
        - left: 52px

      water_2nd:
        - position: absolute
        - top: 133px
        - left: 120px
        - color: "#79D7FA"
        - pointer-events: none

      water_3rd:
        - position: absolute
        - top: 62px
        - left: 120px
        - color: "#79D7FA"
        - pointer-events: none


  # use different styles for a different states:
  # red underline - infloor heating only
  # red background — radiator heating active
  # blue — air conditioning is on
  card_mod:
    style: |
      .cold, .hot, .floor, .none {
        border-radius: 5px;
        margin-right: -1px;
        padding: 3px 9px 3px 11px;  
      }

      .cold { background-color: #4F8ABD; }
      .hot { background-color: #BD4F4F; }

      .floor:after { 
        content: ""; 
        float: left; 
        background: #BD4F4F; 
        width: 100%; 
        height: 5px; 
        margin-top: 2px;
        border-radius: 3px;
        overflow: auto;
      }

      ha-card .ellipsis {
        font-size: 22pt;
        padding: 6px;
        border-radius: 5px;
      }

