# This card is mounted only while the doorbell helper is on. It fills the
# panel so the visitor image is visible without opening another HA view.
type: custom:button-card

show_icon: false
show_name: false
show_label: false
show_state: false

# The periodic sensor redraws the card, and the URL timestamp bypasses image
# caching so the proxy snapshot advances during a long doorbell event.
show_entity_picture: true
entity_picture: >
  [[[
    // The sensor is a redraw dependency; it is not displayed.
    const fake_time = states['sensor.every_5s']
    return "https://cameras.gryzlov.com/homeassistant/camera/doorbell/high?crop=500,1000,900,900&ts=" + Date.now()
  ]]]

styles:
  card:
    - padding: 0px
    - margin: 0px
    - width: 480px
    - height: 480px
    - top: -8px
    - left: -8px
    - background: none
    - position: absolute
    - border-radius: 0px
    - border: none
    - box-shadow: none
  
  entity_picture:
    - width: 100%
    - height: 100%
    - object-fit: cover
    - border-radius: 0px
