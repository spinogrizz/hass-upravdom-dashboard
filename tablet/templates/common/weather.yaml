# Three nested weather_unit cards share rendering logic while receiving
# different forecast keys from sensor.weather_forecast_extra.
weather:
  template: 
    - base
    - height-2rows

  styles:
    grid:
      - grid-template-areas: '"now later after"'
      - grid-template-columns: 1fr 1fr 1fr
      - grid-template-rows: 1fr
    card:
      - padding: 0px
      - margin: 0px  

  # The grid fixes three equal columns so forecasts do not shift neighbors.
  # The sensor's historical names are counterintuitive: 'after' is forecast
  # index 3, while 'later' is index 6. Keep that mapping here so the visible
  # order remains now, nearer forecast, farther forecast.
  custom_fields:
    now: 
      card:
        type: custom:button-card
        template: weather_unit
        variables:  
          forecast: now
        styles:
          custom_fields:
            weather_icon:
              - left: 3px
          label:
            - left: 5px

    later:
      card:
        type: custom:button-card
        template: weather_unit
        variables:  
          forecast: after

    after:
      card:
        type: custom:button-card
        template: weather_unit
        variables:  
          forecast: later
        styles:
          custom_fields:
            weather_icon:
              - left: -1px
          label:
            - left: 2px                
