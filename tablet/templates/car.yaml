car:
  template:
    - base
    - height-1-5-rows

  show_label: true

  label: >
    [[[ 
      const rawCharge = variables.charge
      const charge = Number(rawCharge)
      if (rawCharge !== undefined && rawCharge !== null && String(rawCharge).trim() !== '' &&
          Number.isFinite(charge) && charge >= 0 && charge <= 100) {
        return charge + " %"
      }
      else if ( variables.name === 'tesla' ) {
        return '— %'
      }
      else if ( variables.fuel != undefined ) {
        return `
          <div style="display: flex; flex-direction: column; align-items: flex-end; line-height: 1;">
            <span>${variables.fuel}</span>
            <span style="font-size: 0.67em;">км</span>
          </div>
        `
      } else {
        return ""
      }
    ]]]

  custom_fields:
    charging_indicator: >
      <ha-icon icon="mdi:lightning-bolt" style="width: 35px; height: 35px;"/>

    needs_fuel: >
      <ha-icon icon="mdi:gas-station" style="width: 32px; height: 32px;"/>


  styles:
    card:
      - height: 125px
      - background-size: cover
      - background-image: >
          [[[
            return "url('/local/tablet/car_bg_" 
                 + variables.name
                 + "_" 
                 + (variables.present ? "on" : "off")
                 + ".png?xxxxxx')"
          ]]]

    label:
      - position: absolute
      - top: 16px
      - right: 20px
      - font-size: 30px
      - opacity: 0.9
      - color: >
          [[[
            let red    = "#CF4141"
            let yellow = "#D5C539"
            let green  = "#67C743"
            let white  = "#FFFFFF"

            const rawCharge = variables.charge
            const charge = Number(rawCharge)
            if (rawCharge !== undefined && rawCharge !== null && String(rawCharge).trim() !== '' &&
                Number.isFinite(charge) && charge >= 0 && charge <= 100) {
              if ( charge < 30 ) {
                return red
              } else if ( charge < 65 ) {
                return yellow
              } else {
                return white
              }
            } else if ( variables.fuel != undefined ) {
              let fuel = variables.fuel

              if ( fuel < 100 ) {
                return red
              } else if ( fuel < 150 ) {
                return yellow
              } else {
                return white
              }
            }
          ]]]

    custom_fields:
      charging_indicator:
        - position: absolute
        - bottom: 16px
        - right: 16px
        - color: >
            [[[
              return variables.is_charging ? "#67C743" : "#FFFFFF88"
            ]]]
        
        - visibility: >
            [[[
              return variables.is_plugged === true ? 'visible' : 'hidden'
            ]]]

      needs_fuel:
        - position: absolute
        - bottom: 16px
        - right: 16px
        - color: "#CF4141"
        - visibility: >
            [[[
              return variables.fuel < 150 ? 'visible' : 'hidden'
            ]]]            

